services:
  # Backend API (Free tier)
  - type: web
    name: poker-ev-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FRONTEND_URL
        value: https://poker-ev-frontend.onrender.com

  # Frontend Static Site (Free tier)
  - type: web
    name: poker-ev-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://poker-ev-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html